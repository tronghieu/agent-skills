# Default customization for the manual-testing skill.
#
# Do not edit this file to fit one project: it ships with the skill.
# Override in _project/testing/manual-testing.toml (team, committed) or
# _project/testing/manual-testing.user.toml (personal, not committed).
# Resolve all layers with: python3 {skill-root}/scripts/resolve_customization.py
#
# Merge rules:
# - Strings replace the default.
# - Lists append to the default list.
# - Tables merge key by key.
# - Arrays of tables merge by `id`: matching `id` replaces, new `id`s append.
#
# Placeholders: {project-root} and {skill-root} are substituted at resolve time.

[workflow]

# Instructions run before the adapter's environment is loaded.
activation_steps_prepend = []

# Instructions run after preflight and before the session mission is written.
activation_steps_append = []

# Project testing policy kept in context for the whole session: principles,
# status vocabulary, source hierarchy, evidence rules.
# Entries are literal text or file references prefixed with "file:" (globs allowed).
# A loaded fact outranks this skill's defaults wherever the two disagree.
persistent_facts = []

# Instruction run after the session note and bug reports are written.
# Empty means no extra closing behavior.
on_complete = ""
